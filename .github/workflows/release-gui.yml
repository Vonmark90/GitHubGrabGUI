name: Release GitHub Grab GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build GUI Release
        run: cargo build --release --bin ghgrab-gui --target ${{ matrix.target }}

      - name: Package macOS .app Bundle
        shell: bash
        run: |
          APP_NAME="GitHub Grab GUI.app"
          APP_DIR="dist-app/$APP_NAME"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp "target/${{ matrix.target }}/release/ghgrab-gui" "$APP_DIR/Contents/MacOS/ghgrab-gui"
          chmod +x "$APP_DIR/Contents/MacOS/ghgrab-gui"

          if [ -f "assets/AppIcon.icns" ]; then
            cp "assets/AppIcon.icns" "$APP_DIR/Contents/Resources/AppIcon.icns"
          fi

          cat << "EOF" > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>GitHub Grab GUI</string>
              <key>CFBundleExecutable</key>
              <string>ghgrab-gui</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.vonmark90.github-grab-gui</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GitHub Grab GUI</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.2.0</string>
              <key>CFBundleVersion</key>
              <string>2.2.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          mkdir -p out
          ARCHIVE_NAME="GitHub-Grab-GUI-${{ matrix.suffix }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "out/$ARCHIVE_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: out/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build GUI Release
        run: cargo build --release --bin ghgrab-gui --target x86_64-unknown-linux-gnu

      - name: Package Linux Archive
        shell: bash
        run: |
          mkdir -p pkg/bin pkg/share/applications pkg/share/icons/hicolor/512x512/apps
          cp target/x86_64-unknown-linux-gnu/release/ghgrab-gui pkg/bin/ghgrab-gui
          chmod +x pkg/bin/ghgrab-gui

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png pkg/share/icons/hicolor/512x512/apps/ghgrab-gui.png
          fi

          cat << "EOF" > pkg/share/applications/ghgrab-gui.desktop
          [Desktop Entry]
          Name=GitHub Grab GUI
          Comment=Fast GitHub Repository, Folder & Release Asset Downloader
          Exec=ghgrab-gui
          Icon=ghgrab-gui
          Terminal=false
          Type=Application
          Categories=Utility;Network;
          EOF

          mkdir -p out
          ARCHIVE_NAME="GitHub-Grab-GUI-Linux-x86_64.tar.gz"
          tar -czvf "out/$ARCHIVE_NAME" -C pkg .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build GUI Release
        run: cargo build --release --bin ghgrab-gui --target x86_64-pc-windows-msvc

      - name: Package Windows Archive
        shell: bash
        run: |
          mkdir -p pkg-win
          cp target/x86_64-pc-windows-msvc/release/ghgrab-gui.exe pkg-win/
          if [ -f "README.md" ]; then cp README.md pkg-win/; fi
          if [ -f "LICENSE" ]; then cp LICENSE pkg-win/; fi

          mkdir -p out
          ARCHIVE_NAME="GitHub-Grab-GUI-Windows-x86_64.zip"
          cd pkg-win && 7z a "../out/$ARCHIVE_NAME" *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: out/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Generate Checksums & List
        shell: bash
        run: |
          cd ./release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.2.1}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v2.2.1"
          fi

          cat << "EOF" > release_notes.md
          ### 🐙 GitHub Grab GUI Release

          Cross-platform graphical releases for macOS, Linux, and Windows:

          - **macOS (Apple Silicon & Intel)**: \`GitHub-Grab-GUI-macos-arm64.zip\`, \`GitHub-Grab-GUI-macos-x86_64.zip\`
          - **Linux (x86_64)**: \`GitHub-Grab-GUI-Linux-x86_64.tar.gz\`
          - **Windows (x86_64)**: \`GitHub-Grab-GUI-Windows-x86_64.zip\`

          #### Enhancements & Fixes:
          - 🌙 **High-Contrast GitHub Dark & Light Themes**: Crystal-clear typography with WCAG AAA readability, eliminating low-contrast eye strain.
          - 🌴 **Vaporwave (High-Contrast Edition)**: Optional retro synth theme with enhanced, fully readable text and panels.
          - 📁 **Enhanced File Browser**: Directories sorted first alphabetically, parent directory navigation (\`⬆ Up\`), and interactive breadcrumbs.
          - 📄 **Source Code Viewer**: Line numbers, monospace code viewer, copy-to-clipboard, and binary file detection.
          - 🚀 **GitHub Release Vault**: Browse releases, inspect assets, and download binaries directly.
          - 🔍 **Repository Search**: Integrated search to find and load repos instantly.
          - ⚡ **Performance**: Native Rust GUI powered by egui and tokio.
          EOF

          gh release create "$TAG_NAME" ./release-assets/* \
            --title "🐙 GitHub Grab GUI ($TAG_NAME)" \
            --notes-file release_notes.md \
            --clobber
